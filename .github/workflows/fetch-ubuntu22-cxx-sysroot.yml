name: fetch ubuntu22 cxx sysroot
on:
  push:
    paths:
      - '.github/workflows/fetch-ubuntu22-cxx-sysroot.yml'
  workflow_dispatch:
jobs:
  pack-sysroot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install base C/C++ development runtime
        run: |
          sudo apt-get update
          sudo apt-get -y install libc6-dev linux-libc-dev libstdc++-11-dev libgcc-11-dev libstdc++6 libgcc-s1 libatomic1
      - name: Pack package-owned sysroot files
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/sysroot"
          mkdir -p "$ROOT"
          packages='libc6-dev libc6 linux-libc-dev libstdc++-11-dev libstdc++6 libgcc-11-dev libgcc-s1 libatomic1'
          for pkg in $packages; do dpkg -L "$pkg"; done | sort -u > package-files.txt
          while IFS= read -r f; do
            if [ -f "$f" ] || [ -L "$f" ]; then
              mkdir -p "$ROOT$(dirname "$f")"
              cp -a "$f" "$ROOT$f"
            fi
          done < package-files.txt
          # Dynamic loader aliases used by clang/lld and the produced ELF.
          for f in /lib64/ld-linux-x86-64.so.2 /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2; do
            if [ -e "$f" ] || [ -L "$f" ]; then
              mkdir -p "$ROOT$(dirname "$f")"
              cp -a "$f" "$ROOT$f"
            fi
          done
          tar -I 'zstd -10 -T0' -cf ubuntu22-cxx-sysroot.tar.zst -C "$ROOT" .
          sha256sum ubuntu22-cxx-sysroot.tar.zst > SHA256SUMS.txt
          printf 'gcc=%s\n' "$(gcc -dumpfullversion)" > VERSIONS.txt
          printf 'glibc=%s\n' "$(ldd --version | head -1)" >> VERSIONS.txt
          strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 | grep '^GLIBCXX_' | sort -V | tail -1 >> VERSIONS.txt
      - name: Upload sysroot
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu22-CXX-sysroot
          path: |
            ubuntu22-cxx-sysroot.tar.zst
            SHA256SUMS.txt
            VERSIONS.txt
          compression-level: 0
          retention-days: 1
