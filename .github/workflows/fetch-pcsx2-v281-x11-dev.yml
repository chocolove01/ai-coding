name: fetch pcsx2 v2.8.1 x11 dev
on:
  push:
    paths:
      - '.github/workflows/fetch-pcsx2-v281-x11-dev.yml'
  workflow_dispatch:
jobs:
  pack-dev:
    runs-on: ubuntu-22.04
    steps:
      - name: Install X11 development packages
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            libx11-dev libx11-xcb-dev libxi-dev libxrender-dev libxrandr-dev libxext-dev libxfixes-dev libxcursor-dev libxinerama-dev \
            libxcb1-dev libxcb-composite0-dev libxcb-cursor-dev libxcb-damage0-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-present-dev libxcb-randr0-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev
      - name: Stage public X11 development files
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/x11dev"
          mkdir -p "$P/include" "$P/lib/pkgconfig"
          cp -a /usr/include/X11 "$P/include/"
          cp -a /usr/include/xcb "$P/include/"
          cp -a /usr/lib/x86_64-linux-gnu/libX*.so* "$P/lib/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libxcb*.so* "$P/lib/" || true
          for pc in /usr/lib/x86_64-linux-gnu/pkgconfig/x11*.pc /usr/lib/x86_64-linux-gnu/pkgconfig/x*.pc /usr/lib/x86_64-linux-gnu/pkgconfig/xcb*.pc; do
            [ -e "$pc" ] && cp -a "$pc" "$P/lib/pkgconfig/"
          done
          tar -I 'zstd -10 -T0' -cf pcsx2-2.8.1-x11-dev.tar.zst x11dev
          sha256sum pcsx2-2.8.1-x11-dev.tar.zst > SHA256SUMS.txt
      - name: Upload X11 development files
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2-2.8.1-public-x11-dev
          path: |
            pcsx2-2.8.1-x11-dev.tar.zst
            SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
