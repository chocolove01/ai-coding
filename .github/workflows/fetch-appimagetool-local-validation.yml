name: fetch appimagetool local validation
on:
  push:
    paths:
      - '.github/workflows/fetch-appimagetool-local-validation.yml'
  workflow_dispatch:
jobs:
  fetch-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official appimagetool
        run: |
          set -euo pipefail
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sha256sum appimagetool-x86_64.AppImage > SHA256SUMS.txt
          ./appimagetool-x86_64.AppImage --appimage-version || true
      - name: Upload tool
        uses: actions/upload-artifact@v4
        with:
          name: public-appimagetool-local-validation
          path: |
            appimagetool-x86_64.AppImage
            SHA256SUMS.txt
          retention-days: 1
