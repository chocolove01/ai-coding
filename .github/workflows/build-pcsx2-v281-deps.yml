name: build pcsx2 v2.8.1 deps
on:
  push:
    paths:
      - '.github/workflows/build-pcsx2-v281-deps.yml'
  workflow_dispatch:
jobs:
  build-deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout public PCSX2 source
        run: git clone --depth 1 --branch v2.8.1 https://github.com/PCSX2/pcsx2.git pcsx2-src
      - name: Install dependency build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang cmake curl extra-cmake-modules git libasound2-dev libaio-dev libcurl4-openssl-dev libdbus-1-dev libdecor-0-dev libegl-dev libevdev-dev libfontconfig-dev libfreetype-dev libgtk-3-dev libgudev-1.0-dev libharfbuzz-dev libinput-dev libopengl-dev libopus-dev libpcap-dev libpipewire-0.3-dev libpulse-dev libssl-dev libudev-dev libva-dev libvpl2 libvpl-dev libwayland-dev libx11-dev libx11-xcb-dev libx264-dev libxcb1-dev libxcb-composite0-dev libxcb-cursor-dev libxcb-damage0-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-present-dev libxcb-randr0-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev libxext-dev libxkbcommon-x11-dev libxrandr-dev nasm ninja-build pkg-config zlib1g-dev
      - name: Build official dependency prefix
        run: |
          set -euo pipefail
          cd pcsx2-src
          BUILD_FFMPEG=1 .github/workflows/scripts/linux/build-dependencies-qt.sh "$HOME/deps"
      - name: Stage required system development files into prefix
        run: |
          set -euo pipefail
          mkdir -p "$HOME/deps/include" "$HOME/deps/lib/pkgconfig" "$HOME/deps/lib/dbus-1.0/include"
          cp -a /usr/include/pcap "$HOME/deps/include/"
          cp -a /usr/include/pcap.h "$HOME/deps/include/" || true
          cp -a /usr/include/dbus-1.0 "$HOME/deps/include/"
          cp -a /usr/lib/x86_64-linux-gnu/dbus-1.0/include/. "$HOME/deps/lib/dbus-1.0/include/"
          cp -a /usr/include/freetype2 "$HOME/deps/include/"
          cp -a /usr/include/fontconfig "$HOME/deps/include/"
          cp -a /usr/lib/x86_64-linux-gnu/libpcap.so* "$HOME/deps/lib/"
          cp -a /usr/lib/x86_64-linux-gnu/libdbus-1.so* "$HOME/deps/lib/"
          cp -a /usr/lib/x86_64-linux-gnu/libfreetype.so* "$HOME/deps/lib/"
          cp -a /usr/lib/x86_64-linux-gnu/libfontconfig.so* "$HOME/deps/lib/"
          cp -a /usr/lib/x86_64-linux-gnu/pkgconfig/dbus-1.pc "$HOME/deps/lib/pkgconfig/"
          cp -a /usr/lib/x86_64-linux-gnu/pkgconfig/freetype2.pc "$HOME/deps/lib/pkgconfig/"
          cp -a /usr/lib/x86_64-linux-gnu/pkgconfig/fontconfig.pc "$HOME/deps/lib/pkgconfig/"
          tar -I 'zstd -10 -T0' -cf pcsx2-2.8.1-deps.tar.zst -C "$HOME" deps
          sha256sum pcsx2-2.8.1-deps.tar.zst > SHA256SUMS.txt
      - name: Upload dependency prefix
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2-2.8.1-public-deps
          path: |
            pcsx2-2.8.1-deps.tar.zst
            SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
