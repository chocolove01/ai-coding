name: fetch pcsx2 v2.8.1 opengl dev
on:
  push:
    paths:
      - '.github/workflows/fetch-pcsx2-v281-opengl-dev.yml'
  workflow_dispatch:
jobs:
  pack-dev:
    runs-on: ubuntu-22.04
    steps:
      - name: Install OpenGL development packages
        run: |
          sudo apt-get update
          sudo apt-get -y install libglvnd-dev libgl-dev libglx-dev libopengl-dev libegl-dev
      - name: Stage public OpenGL development files
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/gldev"
          mkdir -p "$P/include" "$P/lib/pkgconfig"
          cp -a /usr/include/GL "$P/include/"
          cp -a /usr/include/EGL "$P/include/"
          cp -a /usr/include/KHR "$P/include/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libGL.so* "$P/lib/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libGLX.so* "$P/lib/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libOpenGL.so* "$P/lib/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libEGL.so* "$P/lib/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libGLdispatch.so* "$P/lib/" || true
          for x in gl egl opengl glx; do
            if [ -e "/usr/lib/x86_64-linux-gnu/pkgconfig/$x.pc" ]; then
              cp -a "/usr/lib/x86_64-linux-gnu/pkgconfig/$x.pc" "$P/lib/pkgconfig/"
            fi
          done
          tar -I 'zstd -10 -T0' -cf pcsx2-2.8.1-opengl-dev.tar.zst gldev
          sha256sum pcsx2-2.8.1-opengl-dev.tar.zst > SHA256SUMS.txt
      - name: Upload OpenGL development files
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2-2.8.1-public-opengl-dev
          path: |
            pcsx2-2.8.1-opengl-dev.tar.zst
            SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
